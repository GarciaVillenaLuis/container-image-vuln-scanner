name: CI & Container Security Pipeline
on: [push, pull_request]

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Unit Tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Audit Sample Dockerfile & SBOM
        run: |
          python container_vuln_scanner.py --stats
          python container_vuln_scanner.py --dockerfile samples/sample_dockerfile
          python container_vuln_scanner.py --sbom samples/clean_sbom.json
          python container_vuln_scanner.py --sbom samples/cyclonedx_sbom.json --format json || true
